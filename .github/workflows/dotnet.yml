name: "Publish application"
on:
  push:
    branches:
      - main

permissions:
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout the code
      - uses: actions/checkout@v6

      # Install .NET Core SDK
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Install dependencies and clean the previous build artefacts
      - name: Install dependencies
        run: |
          dotnet workload restore
          dotnet workload install wasm-tools

      # Generate the website
      - name: Publish
        run: |
          cp wwwroot/index.html wwwroot/404.html
          dotnet publish nakigoe.csproj --configuration Release

      # Publish the website
      - name: GitHub Pages action
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }} # Most “push-to-branch” deploy actions can use the built-in GITHUB_TOKEN, no PAT setup needed (but you still can do PAT, just for experience)
          publish_branch: gh-pages
          publish_dir: bin/Release/net10.0/publish/wwwroot
          allow_empty_commit: false
          keep_files: false
          force_orphan: true
          cname: blazorwasm.nakigoe.org